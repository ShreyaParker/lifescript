name: LifeScript checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: lifescript_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lifescript_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LIFESCRIPT_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/lifescript_test
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - run: flutter analyze --fatal-infos
        working-directory: frontend
      - run: flutter test
        working-directory: frontend
      - run: flutter build web --release
        working-directory: frontend
