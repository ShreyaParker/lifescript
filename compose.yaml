services:
  api:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATA_DIR: /data
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LANGSMITH_TRACING: "false"
    volumes:
      - workflow-data:/data
    restart: unless-stopped
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    env_file: ./backend/.env
    environment:
      DATA_DIR: /data
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LANGSMITH_TRACING: "false"
    volumes:
      - workflow-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 4g
    restart: unless-stopped
volumes:
  workflow-data:
